name: RepoReady
description: Score repository readiness and fail below a chosen threshold
author: kanuwrld contributors

branding:
  icon: check-circle
  color: green

inputs:
  path:
    description: Repository path to audit
    required: false
    default: .
  min-score:
    description: Minimum accepted score from 0 to 100
    required: false
    default: "80"
  format:
    description: Output format: text, json, or markdown
    required: false
    default: text
  output:
    description: Destination path, or - for stdout
    required: false
    default: "-"

runs:
  using: composite
  steps:
    - name: Audit repository
      shell: bash
      env:
        REPOREADY_ACTION_PATH: ${{ github.action_path }}
        REPOREADY_INPUT_PATH: ${{ inputs.path }}
        REPOREADY_INPUT_SCORE: ${{ inputs.min-score }}
        REPOREADY_INPUT_FORMAT: ${{ inputs.format }}
        REPOREADY_INPUT_OUTPUT: ${{ inputs.output }}
      run: |
        export PYTHONPATH="${REPOREADY_ACTION_PATH}/src${PYTHONPATH:+:${PYTHONPATH}}"
        python -m repoready "${REPOREADY_INPUT_PATH}" \
          --min-score "${REPOREADY_INPUT_SCORE}" \
          --format "${REPOREADY_INPUT_FORMAT}" \
          --output "${REPOREADY_INPUT_OUTPUT}"
