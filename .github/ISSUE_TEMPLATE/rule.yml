name: New or changed rule
description: Propose a repository-readiness signal or weight change
title: "rule: "
labels: ["rule", "needs-design"]
body:
  - type: textarea
    id: signal
    attributes:
      label: Signal
      description: What repository evidence should RepoReady detect?
    validations:
      required: true
  - type: input
    id: weight
    attributes:
      label: Proposed weight
      placeholder: "5"
    validations:
      required: true
  - type: textarea
    id: portability
    attributes:
      label: Portability and false positives
      description: Explain ecosystem coverage and likely edge cases.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test cases
      description: List positive and negative fixtures.
    validations:
      required: true
