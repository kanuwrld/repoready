name: Bug report
description: Report incorrect detection, output, or exit behavior
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what should have happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RepoReady version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: structure
    attributes:
      label: Relevant repository structure
      description: Remove secrets and private paths.
      render: text
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      render: shell
    validations:
      required: true
